<div id="conversation-list-container" class="list-group list-group-flush">
    {% for conv in conversations %}
    <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2 px-3 border-0 rounded-3 mb-1 {% if conv.pk == conversation.pk %}active bg-success text-white{% else %}bg-transparent text-dark{% endif %}">
        <a href="{% url 'chat:detail' conv.pk %}" class="text-decoration-none flex-grow-1 text-truncate me-2 {% if conv.pk == conversation.pk %}text-white{% else %}text-dark{% endif %}" title="{{ conv.title }}">
            <div class="fw-semibold small text-truncate">
                <i class="bi bi-chat-text me-1"></i>{{ conv.title }}
            </div>
            <small class="{% if conv.pk == conversation.pk %}text-white-50{% else %}text-muted{% endif %}" style="font-size: 0.72rem;">
                {{ conv.updated_at|date:"M d, h:i A" }}
            </small>
        </a>
        <form method="post" action="{% url 'chat:delete' conv.pk %}" onsubmit="return confirm('Delete this conversation?');" class="mb-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-link btn-sm p-0 {% if conv.pk == conversation.pk %}text-white-50 hover-white{% else %}text-muted hover-danger{% endif %}" title="Delete thread">
                <i class="bi bi-trash"></i>
            </button>
        </form>
    </div>
    {% empty %}
    <div class="p-3 text-center text-muted small">
        <i class="bi bi-chat-dots display-6 d-block mb-2 text-muted"></i>
        No past conversations.
    </div>
    {% endfor %}
</div>
